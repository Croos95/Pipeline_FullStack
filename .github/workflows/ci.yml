name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        # Use a release that supports Node.js 24
        uses: actions/checkout@v6
      - name: Instalar Node.js
        # Use the latest setup-node major that supports Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          
      - name: Instalar dependencias
        run: npm install
      - name: Esperar servidor
        run: sleep 5
      - name: Ejecutar pruebas
        run: npm test
    